    <script>
        //real world problem on closure 
        //problem : 500 colours in a array....click krgte hi background colour change hojaaye


        //TOO LONGGGG
        // document.getElementById("orange").onclick = function(){
        //     document.body.style.backgroundColor = `orange`
        // }                               
        // document.getElementById("green").onclick = function(){
        //     document.body.style.backgroundColor = `green`
        // }
        
        //SOLVING USING CLOSURE
        function clickHandler(color){
            // document.body.style.backgroundColor = `${color}` //ais toh seedha execute hojaayega...hmein ek function return krwana hai pr

            return function(){
                document.body.style.backgroundColor = `${color}`
            }
        }

        document.getElementById('orange').onclick = clickHandler("orange") //agr inner funtion nhi hota toh seedha execute hojaata vo...pr onclick toh ek function maangata hai ki kya krna hai jb button click ho toh
        document.getElementById('green').onclick = clickHandler("green")
