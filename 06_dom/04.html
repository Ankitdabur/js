<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai aur code | DOM</title>
</head>
<body style="background-color: #212121; color: #fff;">
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>

    function addLanguage(language){
        const li = document.createElement('li');
        li.innerText = language;  //bde project mein dikkat...pura tree treverse krna pdega
        document.querySelector(".language").appendChild(li);
    }

    //same bot optimized
    //idhr treverse nhi krna pdeg pura tree so it is optimised
    function addOptiLang(language){
        const li = document.createElement('li')
        li.appendChild(document.createTextNode(language))
        document.querySelector(".language").appendChild(li)
    }

    addLanguage("python")
    addLanguage("cpp")
    addOptiLang("golang")

    //Edit
    const mysecondlang = document.querySelector("li:nth-child(2)")
    // mysecondlang.innerHTML = "FUCK YOU"  //innerHTML pura tree treverse => not good
    const mynewli = document.createElement('li')
    mynewli.textContent = "mojo"
    mysecondlang.replaceWith(mynewli)

    //edit(with the help of outer HTML)
    const firstLang = document.querySelector("li:first-child")
    firstLang.outerHTML = '<li>TypeScript</li>'

    //remove
    const lastlang = document.querySelector('li:last-child')
    lastlang.remove()

    

</script>
</html>
